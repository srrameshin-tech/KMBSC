name: KMBSC Payment Reminders

on:
  schedule:
    # Runs at 04:30 UTC = 10:00 AM IST, on the 14th and 17th of every month.
    # Edit the day-of-month list or time below if you want different dates.
    - cron: '30 4 14,17 * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send KMBSC WhatsApp reminders
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
        run: node send-reminders.js
